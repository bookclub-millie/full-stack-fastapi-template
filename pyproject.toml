[dependency-groups]
dev = [
    "prek>=0.5.3,<1.0.0",
    "typer>=0.27.2,<1.0.0",
    "zizmor>=1.30.1",
]

github-actions = [
    "smokeshow >=0.5.0",
]

[tool.uv]
# Supply-chain cooldown: ignore releases newer than 7 days (bunfig.toml does the same for bun).
# Exceptions go in exclude-newer-package, e.g. { certifi = false }.
exclude-newer = "7 days"

[tool.uv.workspace]
members = ["backend"]

[tool.typos.files]
extend-exclude = [
    "img/",
    "uv.lock",
    "bun.lock",
    "backend/coverage/",
    "backend/htmlcov/",
    "backend/app/frontend/",
    "frontend/dist/",
    "frontend/public/assets/images/",
]

[tool.typos.default]
extend-ignore-re = [
    # GitHub usernames in @mentions
    "@[a-zA-Z0-9](?:-?[a-zA-Z0-9])*",
    # Name of the package in the PR title
    "Bump certifi ",
]

[tool.typos.default.extend-identifiers]
alls = "alls"
