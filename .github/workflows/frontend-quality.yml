name: Frontend Quality

on:
  push:
    branches: [master]
    paths:
      - frontend/**
      - packages/**
      - package.json
      - bun.lock
      - biome.json
      - knip.config.ts
      - .github/workflows/frontend-quality.yml
  pull_request:
    paths:
      - frontend/**
      - packages/**
      - package.json
      - bun.lock
      - biome.json
      - knip.config.ts
      - .github/workflows/frontend-quality.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Manual evidence runs (scripts/harness/run_evidence.py) get their own group and are
  # never cancelled by pushes; only superseded PR runs are cancelled.
  group: frontend-quality-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-quality:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install chromium
        working-directory: frontend
      - name: Check lint and formatting
        run: bun run lint:check
      - name: Check types
        run: bun run typecheck
      - name: Check unused dependencies and exports
        run: bun run check:deps
      - name: Run unit tests with coverage
        run: bun run test:unit
      - name: Build Storybook
        run: bun run build-storybook
      - name: Run Storybook accessibility and interaction tests
        run: bun run test:storybook
      - name: Build app
        run: bun run build
      - name: Upload unit coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-unit-coverage
          path: frontend/coverage
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload unit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-unit-results
          path: frontend/test-results/unit.json
          if-no-files-found: ignore
          retention-days: 30
          overwrite: true # re-runs replace the previous attempt's results
      - name: Upload component test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-component-results
          path: frontend/test-results/storybook.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Storybook build
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-storybook
          path: frontend/storybook-static
          if-no-files-found: ignore
          retention-days: 14
