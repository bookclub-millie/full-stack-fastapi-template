name: Guard Dependencies

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- This workflow only reads context.payload metadata, never checks out PR code
    branches: [master]
    paths:
      - pyproject.toml
      - uv.lock

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check-author:
    runs-on: ubuntu-latest
    steps:
      - name: Check if author has write access or is an allowed bot
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;

            const botAllowlist = new Set(['dependabot[bot]']);

            // author_association only says MEMBER for public org members, so members
            // with private membership were treated as outsiders. Ask for the actual
            // repository permission instead (maintain and triage map to write and read).
            let permission = 'none';
            if (!botAllowlist.has(author)) {
              try {
                ({ data: { permission } } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username: author,
                }));
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            const allowed = botAllowlist.has(author) || ['admin', 'write'].includes(permission);

            if (!allowed) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `This PR modifies dependency files (\`pyproject.toml\` or \`uv.lock\`), which is restricted to people with write access to this repository.\n\nIf you need a dependency change, please ask a maintainer, describing what you need and why.\n\nClosing this PR automatically.`
              });

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                state: 'closed'
              });

              core.setFailed('Dependency changes are restricted to people with write access.');
            } else {
              console.log(`Author ${author} (permission=${permission}) is allowed to make dependency changes.`);
            }
