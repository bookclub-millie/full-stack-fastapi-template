schema: spec-driven

# 산출물 형식 규칙. Issue 동기화와 Harness Gate의 문서 추적성 검사가 이 형식에
# 의존한다. 근거: docs/adr/001-openspec-docs-traceability.md

context: |
  Language: Korean
  All artifacts must be written in Korean.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  스택: FastAPI + SQLModel + PostgreSQL(backend/), React + TypeScript + Vite + KDS(@kds/ui)(frontend/, packages/ui/), pytest(backend/tests/), Playwright E2E(frontend/tests/e2e/), vitest 단위(frontend/src/**/*.test.ts).
  평가 문서(docs/*.md, README.md)는 REQ → AC → Issue·코드 → TC → 실제 결과로 이어져야 한다. 계획·예시·실행하지 않은 시험을 완료로 기록하지 않는다.
  ID는 저장소 전체에서 하나씩 증가한다: REQ-xx·AC-xx(docs/prd.md), FLOW-xx(docs/experience.md), TC-xx(docs/e2e-test.md), SEC-xx(docs/security-compliance.md, 주최 측 docs/security-policy.md 기준). 새 REQ·AC·FLOW·TC 번호는 추측하지 말고 `python3 -I scripts/harness/next_ids.py --github`가 출력한 번호부터 차례로 쓴다. 제안 PR(spec·tasks.md)이 머지되면 그 번호가 확정되고, 다른 변경이 이미 쓰는 번호면 Harness Gate가 실패시킨다(그때 다시 실행해 번호를 바꾼다).

rules:
  proposal:
    - 첫 줄은 `# <기능 이름>`으로 쓴다(`# Proposal` 금지). 이 이름이 GitHub Issue 제목이 된다.
    - "제목 바로 아래에 세 줄을 그대로 쓴다: `요구사항: REQ-01`(여러 개면 쉼표로 구분), `담당: @<GitHub ID>`, `범위: 필수` 또는 `범위: 추가`."
    - 주최 측 주제 요구와 팀이 더한 아이디어를 구분해 What Changes에 적는다.
  specs:
    - "모든 요구사항 이름은 `### Requirement: REQ-xx <이름>`으로 쓰고, proposal의 요구사항 줄에 있는 ID를 쓴다."
    - "모든 시나리오 이름은 `#### Scenario: AC-xx <이름>`으로 쓴다. 시나리오가 docs/prd.md의 인수조건(AC)이다."
    - "시나리오가 사용자 흐름이나 보안 항목에 해당하면 그 아래에 `- **연결**: FLOW-xx, SEC-xx` 줄을 둔다."
    - 정상 경로만 쓰지 말고 오류·빈 상태·권한·복구 시나리오를 함께 쓴다. 결과는 화면·응답·저장값처럼 관찰할 수 있게 쓴다.
  design:
    - 저장소 전체에 영향을 주는 결정이면 ADR(docs/adr/000-template.md 복사)과 docs/arch.md 주요 결정 표의 행을 tasks에 넣는다.
  tasks:
    - "마지막 작업 그룹은 `## N. 문서·근거`로 두고 다음을 넣는다: docs/prd.md 추적표에 REQ·AC 행 추가(상태 `계획`, 한 REQ는 한 행이고 새 AC는 그 REQ 행의 AC 칸에 추가), 사용자에게 보이는 변경이면 docs/experience.md에 FLOW 행 추가, SEC를 연결한 시나리오가 있으면 docs/security-compliance.md 행 갱신."
    - "AC마다 TC ID를 이름에 단 테스트를 작성하는 작업을 해당 구현 그룹 안에 한 줄씩 넣고, 줄에 TC·AC·파일·테스트 이름과 시나리오 행 추가를 함께 적는다: `- [ ] 2.3 TC-07 (AC-07) backend/tests/api/routes/test_items.py::test_tc_07_<설명> 작성, docs/e2e-test.md 테스트 시나리오에 TC-07 행 추가` 또는 `- [ ] 2.4 TC-08 (AC-08) frontend/tests/e2e/items.spec.ts::\"TC-08 <설명>\" 작성, …`. TC를 단 테스트는 시나리오 행과 같은 커밋에 있어야 검사를 통과한다. 결과가 수집되는 위치는 backend/tests(pytest), frontend/tests/e2e(Playwright), frontend/src/**/*.test.ts(vitest `it(\"TC-09 <설명>\", ...)`)뿐이다. 자동화할 수 없는 AC는 시나리오 행의 종류 칸을 정확히 `수동`으로 적는다(수동 TC는 결과가 수집되지 않아 REQ 완료의 근거가 되지 않는다)."

operations:
  apply:
    guidance:
      - 각 AC를 확인하는 테스트를 tasks.md에 적힌 파일·TC ID 이름 그대로 작성한 뒤 해당 작업을 완료로 표시한다. 다른 파일에 두어야 하면 tasks.md의 경로를 먼저 고친다(archive 때 Harness Gate가 대조한다). 테스트 하나에는 TC ID를 하나만 붙이고, Playwright는 test.describe·test.step이 아니라 test() 제목에 붙인다.
      - 작업을 마치기 전에 `python3 -I scripts/harness/tc_check.py`를 실행해 통과시킨다. 테스트 이름의 TC가 e2e-test.md 테스트 시나리오에 없거나 표기가 틀리면 실패한다.
      - apply 단계에서는 문서의 상태를 `완료`나 `PASS`로 바꾸지 않는다. 결과는 archive 단계에서 수집한 근거로만 기록한다.
  archive:
    guidance:
      - "archive 전에 `python3 scripts/harness/collect_evidence.py --sha <PR head SHA>`를 실행하고, 출력된 행을 docs/e2e-test.md 실행 결과 표에 그대로 옮긴다. 도구가 보고하지 않은 결과는 쓰지 않는다. 도구가 결과를 찾지 못하면(실행 중, TC ID 없음) 기록하지 않고 `미검증`으로 둔다. 문서만 바꾼 커밋이라 시험이 돌지 않았으면 `python3 scripts/harness/run_evidence.py --ref <PR 브랜치>`로 모든 시험을 수동 실행한다(브랜치가 최신 master를 반영해야 수동 실행이 된다)."
      - 그 결과로 docs/prd.md 상태, docs/experience.md 구현 후 확인, docs/security-compliance.md 적용·검증 결과를 갱신한다. 근거가 없는 항목은 `미검증`으로 남긴다.
      - "docs/development.md의 'AI 활용과 검증' 표에 이 변경의 행을 추가한다: Issue 칸은 `#<번호> (<change-id>)`(번호는 `gh issue list --label openspec --search <change-id>`로 찾는다), 담당자, AI 도구·사용 목적, 변경 코드(PR·커밋), 검증·발견 문제, 수정·재시험 근거를 모두 채운다. 이 행이 없으면 Harness Gate가 PR을 실패 처리한다."
